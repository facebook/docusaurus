name: Windows Tests

on:
  pull_request:
    branches:
      - main
      - docusaurus-v**
    paths:
      - package.json
      - pnpm-lock.yaml
      - vitest.config.ts
      - test/**
      - packages/**
      - tsconfig.*.json
      - .github/workflows/tests-windows.yml
      - .github/actions/**

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-test:
    name: Windows Tests
    timeout-minutes: 30
    runs-on: windows-8-core
    strategy:
      matrix:
        node: ['26.13', '26']
    steps:
      - name: Support longpaths
        run: git config --system core.longpaths true
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No pnpm cache on Windows on purpose: restoring it takes 20-80s,
      # more than it saves on "pnpm install"
      - name: Set up pnpm, Node.js ${{ matrix.node }} and dependencies
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - name: Docusaurus Tests
        run: pnpm test
      - name: Create a deep path
        # https://github.com/meta/docusaurus/pull/4899
        # https://github.com/meta/docusaurus/issues/5793
        run: |
          mkdir -p "website/_dogfooding/_pages tests/deep-file-path-test/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar/foo/bar"
          cd "$_"
          echo "# hello" > test-file.md
      # Lightweight version of tests-swizzle.yml workflow, but for Windows
      - name: Swizzle Wrap TS
        run: pnpm --filter website test:swizzle:wrap:ts
      - name: Docusaurus Build
        run: pnpm build:website:fast
        env:
          DOCUSAURUS_PERF_LOGGER: 'true'

      - name: TypeCheck website
        # see https://github.com/meta/docusaurus/pull/10486
        run: pnpm --filter website typecheck

      # The TypeScript compiler of the tested version runs with pnpm dlx,
      # without modifying the workspace dependencies (package.json, catalogs)
      - name: TypeCheck website - min version - v6.0
        run: |
          pnpm dlx --package=typescript@6.0 tsc --version
          pnpm dlx --package=typescript@6.0 tsc --project website/tsconfig.json

      - name: TypeCheck website - max version - Latest
        # For latest TS there are often lib check errors, so we disable it
        # Details: https://github.com/meta/docusaurus/pull/10486
        run: |
          pnpm dlx --package=typescript@latest tsc --version
          pnpm dlx --package=typescript@latest tsc --project website/tsconfig.skipLibCheck.json
