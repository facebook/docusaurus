name: Lint AutoFix

on:
  pull_request:
    branches:
      - main
      - docusaurus-v**

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint-autofix:
    name: Lint AutoFix
    runs-on: ubuntu-latest

    permissions:
      contents: write

    # ⚠️ No GitHub Actions cache on purpose, enforced by GitHub for every step
    # This job can push commits to the repository
    # See https://docs.github.com/actions/reference/workflows-and-actions/workflow-syntax#cache-mode
    cache-mode: none

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}

      - name: Set up pnpm, Node.js and dependencies
        uses: ./.github/actions/setup
        with:
          # Security: prevents cache poisoning, as this job can push commits to the repository
          cache: false

      - name: AutoFix Duplicated deps
        run: pnpm lint:deps:fix

      - name: AutoFix Formatting
        run: pnpm format

      - name: AutoFix JS
        run: pnpm lint:js:fix

      - name: AutoFix Style
        run: pnpm lint:style:fix

      - name: AutoFix Spelling
        run: pnpm lint:spelling:fix

      - name: AutoFix Dependency versions
        run: pnpm lint:syncpack:fix

      - name: Print Diff
        run: git diff

      - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          commit_message: 'refactor: apply lint autofix'
