name: Build Persistent Cache

on:
  pull_request:
    branches:
      - main
      - docusaurus-v**
    paths:
      - packages/**
      - .github/workflows/build-persistent-cache.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Persistent Cache
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm, Node.js and dependencies
        uses: $/.github/actions/setup
        with:
          cache: true
      - name: Build with a cold cache
        run: pnpm build:website:fast
      - name: Build with a warm client cache and a cold server cache
        # Another server Node.js target only evicts the server cache, like a Node.js upgrade
        # See https://github.com/meta/docusaurus/pull/PR_NUMBER
        run: pnpm build:website:fast
        timeout-minutes: 5
        env:
          DOCUSAURUS_SERVER_NODE_TARGET: 24.0.0
