name: Publish

on:
  # Publish main canary daily
  schedule:
    - cron: '23 3 * * *'

  # Publish release on manual dispatch
  workflow_dispatch:
    inputs:
      npm_version:
        description: 'NPM Version - Including prerelease suffix, ignored by canary releases'
        required: false
      npm_tag:
        type: choice
        description: 'NPM Dist Tag - Use `latest` for official stable releases'
        # default: canary
        required: true
        options:
          - canary
          - alpha
          - beta
          - rc
          - latest
          - v3-stable

# Explicitly no token permissions by default, instead of the repository default ones
# See https://docs.zizmor.sh/audits/#excessive-permissions
permissions: {}

# Queues releases, without cancelling the one in progress or the pending ones
# See https://docs.zizmor.sh/audits/#concurrency-limits
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

# ⚠️ No GitHub Actions cache on purpose, enforced by GitHub for every step
# A poisoned cache increases the chance of a compromised release being published
# See https://docs.github.com/actions/reference/workflows-and-actions/workflow-syntax#cache-mode
cache-mode: none

# npm trusted publishing (OIDC) is configured for this workflow file only
# Keep all npm publishing jobs in this file, see https://docs.npmjs.com/trusted-publishers
jobs:
  canary:
    name: Publish Canary release
    if: |
      github.repository == 'meta/docusaurus' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.npm_tag == 'canary')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # For OIDC, see https://docs.npmjs.com/trusted-publishers
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Needed to get the commit number with "git rev-list --count HEAD"
      - name: Check for unpublished canary changes
        id: canary-check
        run: |
          PUBLISHED_COMMIT_NUMBER=$(npm view @docusaurus/core@canary version | sed -E 's/.*-canary-([0-9]+).*/\1/')
          LAST_CHANGE_COMMIT=$(git log -1 --format=%H -- \
            .github/workflows/publish.yml \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            tsconfig.base.json \
            tsconfig.base.client.json \
            packages)
          LAST_CHANGE_COMMIT_NUMBER=$(git rev-list --count "$LAST_CHANGE_COMMIT")
          if [ "$LAST_CHANGE_COMMIT_NUMBER" -le "$PUBLISHED_COMMIT_NUMBER" ]; then
            echo "No package change since canary commit number $PUBLISHED_COMMIT_NUMBER, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up pnpm, Node.js and dependencies
        if: steps.canary-check.outputs.skip != 'true'
        uses: $/.github/actions/setup
        with:
          #  ⚠️ Do not use any cache on purpose
          # It increases the chance of a compromised release being publish
          # See https://github.com/actions/setup-node/issues/1445#issuecomment-4040130833
          cache: false
      - name: Prepare git
        run: |
          git config --global user.name "Docusaurus"
          git config --global user.email "github@docusaurus.io"

      - name: Publish Canary release
        if: steps.canary-check.outputs.skip != 'true'
        run: |
          pnpm canary:bumpVersion
          pnpm install --frozen-lockfile || pnpm install --frozen-lockfile || pnpm install --frozen-lockfile
          pnpm canary:publish

  release:
    name: Publish NPM release
    if: |
      github.repository == 'meta/docusaurus' &&
      github.event_name == 'workflow_dispatch' && github.event.inputs.npm_tag != 'canary'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # For OIDC, see https://docs.npmjs.com/trusted-publishers
      contents: write # For GitHub tags
    steps:
      - name: Check NPM version input
        if: github.event.inputs.npm_version == ''
        run: |
          echo "::error::The npm_version input is required for non-canary releases"
          exit 1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pnpm, Node.js and dependencies
        uses: $/.github/actions/setup
        with:
          #  ⚠️ Do not use any cache on purpose
          # It increases the chance of a compromised release being publish
          # See https://github.com/actions/setup-node/issues/1445#issuecomment-4040130833
          cache: false
      - name: Prepare git
        run: |
          git config --global user.name "Docusaurus"
          git config --global user.email "github@docusaurus.io"

      # Inputs are passed through env vars to prevent shell injection
      # See https://docs.zizmor.sh/audits/#template-injection
      - name: Publish NPM release
        env:
          NPM_VERSION: ${{ github.event.inputs.npm_version }}
          NPM_TAG: ${{ github.event.inputs.npm_tag }}
        run: |
          pnpm lerna version "$NPM_VERSION" \
            --force-publish \
            --exact \
            --loglevel verbose \
            --yes \
            --no-push
          pnpm --recursive publish --tag "$NPM_TAG" --no-git-checks

      # Only this step gets the token, from env to keep it out of the process list
      - name: Push Git tag
        env:
          NPM_VERSION: ${{ github.event.inputs.npm_version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # The empty helper resets the configured ones
          git -c credential.helper= \
            -c credential.helper='!f() { echo username=x-access-token; echo "password=$GITHUB_TOKEN"; }; f' \
            push origin "v$NPM_VERSION"

        # TODO should we push the package version local updates to Git?
        #  "main" is currently protected, even GitHub Actions can't push to it
        #  However it remains useful to push the git tag
