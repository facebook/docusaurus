name: CodeQL

on:
  push:
    branches:
      - main
      - docusaurus-v**
  pull_request:
    branches:
      - main
      - docusaurus-v**
  schedule:
    - cron: 25 22 * * 3

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Explicitly no token permissions by default, instead of the repository default ones
# See https://docs.zizmor.sh/audits/#excessive-permissions
permissions: {}

jobs:
  analyze:
    name: Analyze
    if: github.repository == 'meta/docusaurus'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    # ⚠️ No GitHub Actions cache on purpose, enforced by GitHub for every step
    # This job can write security alerts, a poisoned cache could hide some
    # See https://docs.github.com/actions/reference/workflows-and-actions/workflow-syntax#cache-mode
    cache-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
