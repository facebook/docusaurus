name: CodeQL

on:
  push:
    branches:
      - main
      - docusaurus-v**
  pull_request:
    branches:
      - main
      - docusaurus-v**
  schedule:
    - cron: 25 22 * * 3

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    if: github.repository == 'facebook/docusaurus'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    # ⚠️ No GitHub Actions cache on purpose, enforced by GitHub for every step
    # This job can write security alerts, a poisoned cache could hide some
    # See https://docs.github.com/actions/reference/workflows-and-actions/workflow-syntax#cache-mode
    cache-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # 4.38.2
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # 4.38.2
