name: Continuous Releases

on:
  push:
    branches:
      - main
      - docusaurus-v**
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# ⚠️ No GitHub Actions cache on purpose, enforced by GitHub for every step
# A poisoned cache increases the chance of a compromised release being published
# See https://docs.github.com/actions/reference/workflows-and-actions/workflow-syntax#cache-mode
cache-mode: none

jobs:
  release:
    name: Continuous Releases
    if: github.repository == 'meta/docusaurus'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm, Node.js and dependencies
        uses: ./.github/actions/setup
        with:
          #  ⚠️ Do not use any cache on purpose
          # It increases the chance of a compromised release being publish
          # See https://github.com/actions/setup-node/issues/1445#issuecomment-4040130833
          cache: false

      - name: Build packages
        run: pnpm build:packages

      - name: Initialize fresh templates
        run: |
          node ./packages/create-docusaurus/bin/index.js template/docusaurus-classic-js classic --javascript -p npm
          node ./packages/create-docusaurus/bin/index.js template/docusaurus-classic-ts classic --typescript -p npm

      - name: Release
        # --pnpm: use pnpm pack, which replaces the catalog: protocol with versions
        run: pnpm pkg-pr-new publish './packages/*' --template './template/*' --compact --comment=off --pnpm
