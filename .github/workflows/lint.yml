name: Lint

on:
  pull_request:
    branches:
      - main
      - docusaurus-v**

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          check-latest: true
          cache: pnpm
      - name: Installation
        run: pnpm install --frozen-lockfile || pnpm install --frozen-lockfile || pnpm install --frozen-lockfile
      - name: Check immutable pnpm-lock.yaml
        run: git diff --exit-code

      - name: Add CSpell problem matcher
        run: echo "::add-matcher::.github/workflows/cspell-problem-matcher.json"

      # Independent read-only checks: run them concurrently
      # A failing check doesn't hide the results of the other ones
      # See https://github.blog/changelog/2026-06-25-actions-steps-can-now-be-run-in-parallel/
      - parallel:
          - name: ESLint
            run: pnpm lint:js --quiet
          - name: Stylelint
            run: pnpm lint:style
          - name: Spelling
            run: pnpm lint:spelling
          - name: Syncpack
            run: pnpm lint:syncpack
          - name: Check deduped pnpm-lock.yaml
            run: pnpm lint:deps
          - name: Knip
            run: pnpm lint:knip
          - name: Check Formatting
            run: pnpm format:diff
