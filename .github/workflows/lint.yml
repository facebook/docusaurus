name: Lint

on:
  pull_request:
    branches:
      - main
      - docusaurus-v**

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm, Node.js and dependencies
        uses: ./.github/actions/setup
        with:
          cache: true
      - name: Check immutable pnpm-lock.yaml
        run: git diff --exit-code

      - name: Add CSpell problem matcher
        run: echo "::add-matcher::.github/workflows/cspell-problem-matcher.json"

      # Independent read-only checks: run them concurrently
      # A failing check doesn't hide the results of the other ones
      # Keep in sync with the "lint" script of package.json
      # See https://github.blog/changelog/2026-06-25-actions-steps-can-now-be-run-in-parallel/
      - parallel:
          - name: ESLint
            run: pnpm lint:js --quiet
          - name: Stylelint
            run: pnpm lint:style
          - name: Spelling
            run: pnpm lint:spelling
          - name: Syncpack
            run: pnpm lint:syncpack
          - name: Catalogs
            run: pnpm lint:catalogs
          - name: Check deduped pnpm-lock.yaml
            run: pnpm lint:deps
          - name: Knip
            run: pnpm lint:knip
          - name: Knip production
            run: pnpm lint:knip:production
          - name: Check Formatting
            run: pnpm format:diff
