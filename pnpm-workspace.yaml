nodeLinker: 'isolated'

# Link init templates (which can't use workspace:*) to local packages
linkWorkspacePackages: true

packages:
  - 'packages/*'
  - 'argos'
  - 'website'
  - 'test-website-in-workspace'
  - 'packages/create-docusaurus/templates/*'
  - 'admin/scripts'
  - 'admin/test-bad-package'
  - 'admin/new.docusaurus.io'

# Versions of the dependencies shared by several monorepo packages
# Packages reference them with the "catalog:" protocol
catalog:
  '@babel/core': ^7.29.7
  '@docsearch/react': ^4.7.0
  '@mdx-js/mdx': ^3.1.1
  '@rspack/core': ^2.2.3
  '@rspack/dev-server': ^2.2.1
  '@total-typescript/shoehorn': ^0.1.2
  '@types/escape-html': ^1.0.4
  '@types/history': ^4.7.11
  '@types/mdast': ^4.0.4
  '@types/prismjs': ^1.26.6
  '@types/react-router-config': ^5.0.11
  '@types/react-router-dom': ^5.3.3
  '@types/unist': ^3.0.3
  cheerio: ^1.2.0
  combine-promises: ^1.2.0
  commander: ^15.0.0
  copy-text-to-clipboard: ^3.2.2
  cross-env: ^10.1.0
  dedent: ^1.7.2
  escape-html: ^1.0.3
  eta: ^4.6.0
  execa: ^10.0.1
  image-size: ^2.0.4
  jiti: ^2.7.0
  joi: ^18.2.8
  js-yaml: ^5.4.1
  lodash: ^4.18.1
  mdast-util-directive: 3.1.0
  mdast-util-mdx: ^3.0.0
  oxfmt: ^0.70.0
  p-queue: ^9.3.3
  postcss: ^8.5.28
  prismjs: ^1.30.0
  prompts: ^2.4.2
  remark: ^15.0.1
  remark-gfm: ^4.0.1
  remark-mdx: ^3.1.1
  rimraf: ^6.1.3
  schema-dts: ^1.1.5
  semver: ^7.8.5
  stylelint: ^17.15.0
  to-vfile: ^8.0.0
  tree-node-cli: ^3.0.0
  tslib: ^2.8.1
  unified: ^11.0.5
  unist-util-visit: ^5.1.0
  utility-types: ^3.11.0
  webpack: ^5.111.0
  webpack-merge: ^6.0.1

overrides:
  axios: 1.16.1 # Fix CVEs https://github.com/axios/axios/security/advisories
  tar: ^7.5.16 # Fix CVEs https://github.com/isaacs/node-tar/security/advisories
  # Monorepo deduplicate sharp (force Argos > Sharp upgrade)
  # This version doesn't use a postinstall script
  # See https://sharp.pixelplumbing.com/changelog/v0.35.0/
  sharp: ^0.35.1

minimumReleaseAge: 10080 # 7 days in minutes
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  - image-size@2.0.4
  - webpack@5.111.0
  - enhanced-resolve@5.25.0
  - schema-utils@4.5.0
  - react@19.3.0
  - react-dom@19.3.0
  - scheduler@0.28.0
  - '@types/react@19.3.0'
  - '@types/react-dom@19.3.0'
  - tar@7.5.16
  - pnpm
  - typescript
  - '@rspack/*'
  - '@crowdin/*'

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600 # ignore packages published 1+ year ago
trustPolicyExclude:
  - 'tinyexec@1.2.2'
  - '@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1'
  - 'browserslist-load-config@1.0.2'
  - '@vercel/detect-agent@1.2.5' # See https://github.com/vercel/vercel/issues/17408

trustLockfile: false
blockExoticSubdeps: true
verifyDepsBeforeRun: error

strictDepBuilds: true
dangerouslyAllowAllBuilds: false
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  fast-folder-size: false
  nx: false
  sharp: false
